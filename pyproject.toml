[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-qa-lab"
version = "0.1.0"
description = "Trusted foundation for a constrained agentic quality engineering platform."
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Sarah Moustafa"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=agentic_qa --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentic_qa"]

[tool.coverage.run]
source = ["agentic_qa"]

[tool.coverage.report]
fail_under = 85
show_missing = true
